name: test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  formatter:
    name: Run CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Instantiate packages
        run: make instantiate
      - name: Test check
        run: make test_lib

